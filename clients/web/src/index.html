<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>gateterm</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div id="sidebar-head">
        <button id="sidebar-position" type="button" data-i18n-title="sidebar.pinRight" aria-controls="sidebar"></button>
        <span id="logo">gateterm</span>
        <button id="open-history" type="button" data-i18n-title="history.title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5M12 7v5l4 2"/></svg></button>
        <button id="back-to-list" type="button" data-i18n-title="app.backToList" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button>
        <button id="open-settings" type="button" data-i18n-title="app.settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
        <button id="new-session" type="button" data-i18n-title="app.newSession"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 4.5v15M4.5 12h15"/></svg></button>
      </div>
      <nav id="session-nav"></nav>
      <div id="sidebar-foot">
        <div><span data-i18n="app.kernel"></span> · <span id="conn-state"></span></div>
        <div id="cloud-state" role="status" aria-live="polite"></div>
        <div id="update-status" role="status" aria-live="polite" hidden></div>
      </div>
    </aside>
    <div id="scrim" hidden></div>
    <main id="workspace">
      <button id="menu" type="button" data-i18n-title="app.sessionList" aria-controls="sidebar" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <button id="sidebar-show" type="button" data-i18n-title="sidebar.show" aria-controls="sidebar" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16m5-11-3 3 3 3"/></svg>
      </button>
      <div id="reconnect-banner" hidden></div>
      <div id="error-banner" hidden></div>
      <div id="agent-banner" hidden></div>
      <div id="session-list"></div>
      <div id="chat-view" hidden></div>
      <div id="terminal-wrap" hidden><div id="terminal"></div></div>
    </main>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
