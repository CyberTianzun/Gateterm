# Xcode project definition. Generate the project with:  cd clients/ios && xcodegen
name: Gateterm
options:
  bundleIdPrefix: ai.eclosion.gateterm
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.3"
    CURRENT_PROJECT_VERSION: "13"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Gateterm:
    type: application
    platform: iOS
    sources:
      - path: Gateterm
        excludes:
          - "**/.DS_Store"
      - path: Generated/gateterm_cloud_ffi.swift
        optional: true
    dependencies:
      - framework: Generated/GatetermFFI.xcframework
        embed: false
    preBuildScripts:
      - name: Build Rust FFI
        basedOnDependencyAnalysis: false
        script: |
          "${PROJECT_DIR}/../../scripts/build-ios-ffi.sh" --if-stale "${PROJECT_DIR}/Generated"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.eclosion.gateterm.ios
        PRODUCT_NAME: Gateterm
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Gateterm/Gateterm.entitlements
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Gateterm/Info.plist
    info:
      path: Gateterm/Info.plist
      properties:
        CFBundleDisplayName: Gateterm
        # Keep in sync with [workspace.package] version / version_code in the root Cargo.toml.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans, en]
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: false
        UIStatusBarStyle: UIStatusBarStyleDefault
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Scan the connection QR code shown in Gateterm Desktop settings.
        NSLocalNetworkUsageDescription: Connect to Gateterm servers on your local network.
        # Servers are reached by LAN IP, Tailscale names or user domains, often over plain ws://.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
  GatetermTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - GatetermTests
    dependencies:
      - target: Gateterm
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Gateterm.app/Gateterm"
schemes:
  Gateterm:
    build:
      targets:
        Gateterm: all
        GatetermTests: [test]
    test:
      targets:
        - GatetermTests
