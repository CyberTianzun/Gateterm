# Merge only into the existing gateterm.signal.top TLS server block.
# Keep all existing Cloud /v1, auth, privacy and other locations unchanged.
location = /ws {
    proxy_pass http://127.0.0.1:17685;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
}

location = /api {
    proxy_pass http://127.0.0.1:17685;
    proxy_set_header Host $host;
}

location ^~ /api/ {
    proxy_pass http://127.0.0.1:17685;
    proxy_set_header Host $host;
}
