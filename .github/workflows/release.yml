name: release

# tag 用前缀区分用途:`release-v<semver>` 只给这个 workflow 用,以后别的流程
# (比如 nightly-*、docs-*)各取各的前缀,互不误触发。
#   release-v1.2.3        正式版
#   release-v1.2.3-rc.1   带 `-` 后缀的视为预发布
on:
  push:
    # 发布脚本改动自动试跑打包;分支构建不创建 Release。
    branches: [dev]
    paths: [".github/workflows/release.yml"]
    tags: ["release-v[0-9]+.[0-9]+.[0-9]+*"]
  # 手动触发只构建、上传 Actions 产物,不发 Release:用来在打 tag 前试跑一遍
  workflow_dispatch:

# 同一个 tag 重复推送时,取消前一次还在跑的
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      # 版本号取自 tag:release-v0.1.0 -> v0.1.0;并且必须和各 crate 的 Cargo.toml
      # 一致,否则 desktop 的 Info.plist 等处会和 Release 名对不上
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#release-}"
            expected="${version#v}"
            for f in crates/*/Cargo.toml clients/desktop-client/Cargo.toml; do
              actual="$(sed -n 's/^version *= *"\(.*\)"/\1/p' "$f" | head -1)"
              if [ "$actual" != "$expected" ]; then
                echo "::error file=$f::version 是 $actual,而 tag 是 $GITHUB_REF_NAME(期望 $expected)"
                exit 1
              fi
            done
            android_version="$(sed -n 's/^[[:space:]]*versionName *= *"\([^"]*\)"/\1/p' clients/android/app/build.gradle.kts | head -1)"
            if [ "$android_version" != "$expected" ]; then
              echo "::error file=clients/android/app/build.gradle.kts::versionName 是 $android_version,而 tag 是 $GITHUB_REF_NAME(期望 $expected)"
              exit 1
            fi
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            desktop: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # arm64 交叉编译,不依赖 ARM runner 的可用性
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            linker: aarch64-linux-gnu-gcc
            apt: gcc-aarch64-linux-gnu
          - target: aarch64-apple-darwin
            os: macos-latest
            desktop: true
    steps:
      - uses: actions/checkout@v4

      # web 产物必须先于 cargo build:server 用 rust-embed 把 clients/web/dist/ 编进二进制
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - name: Build web client
        working-directory: clients/web
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross linker
        if: matrix.apt
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}
          echo "CARGO_TARGET_$(echo ${{ matrix.target }} | tr 'a-z-' 'A-Z_')_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"

      - name: Build server
        run: cargo build --release --target ${{ matrix.target }} -p gateterm-server

      # desktop 只支持 Windows/macOS
      - name: Build desktop
        if: matrix.desktop
        run: cargo build --release --target ${{ matrix.target }} -p gateterm-desktop

      - name: Bundle desktop (macOS)
        if: matrix.desktop && runner.os == 'macOS'
        run: ./scripts/bundle-macos.sh ${{ matrix.target }}

      - name: Bundle desktop (Windows)
        if: matrix.desktop && runner.os == 'Windows'
        shell: cmd
        run: scripts\bundle-windows.bat ${{ matrix.target }}

      # 所有产物统一收进 dist/,文件名都带版本号和 target,并各配一个 .sha256
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          server="gateterm-server-${VERSION}-${{ matrix.target }}.tar.gz"
          tar -czf "dist/$server" -C "target/${{ matrix.target }}/release" gateterm-server
          if [ "${{ matrix.desktop }}" = "true" ]; then
            desktop="gateterm-desktop-${VERSION}-${{ matrix.target }}.zip"
            # ditto 保留 .app 的权限位和扩展属性,比 zip -r 可靠
            ditto -c -k --keepParent target/bundle/gateterm.app "dist/$desktop"
          fi
          cd dist && for f in *; do shasum -a 256 "$f" > "$f.sha256"; done

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/gateterm-server.exe" `
            -DestinationPath "dist/gateterm-server-$env:VERSION-${{ matrix.target }}.zip"
          if ("${{ matrix.desktop }}" -eq "true") {
            Compress-Archive -Path "target/bundle/gateterm-desktop.exe" `
              -DestinationPath "dist/gateterm-desktop-$env:VERSION-${{ matrix.target }}.zip"
          }
          Get-ChildItem dist -File | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + "  $($_.Name)" |
              Out-File -Encoding ascii "$($_.FullName).sha256"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: gateterm-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  android:
    name: Android arm64-v8a
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      ANDROID_NDK_VERSION: "29.0.14206865"
      ANDROID_BUILD_TOOLS_VERSION: "36.0.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;$ANDROID_BUILD_TOOLS_VERSION" "ndk;$ANDROID_NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64-v8a
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Restore Android push configuration
        env:
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
          ANDROID_ALIYUN_SERVICES_JSON: ${{ secrets.ANDROID_ALIYUN_SERVICES_JSON }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          package = "ai.eclosion.gateterm.android"
          configs = (
              ("ANDROID_GOOGLE_SERVICES_JSON", "google-services.json"),
              ("ANDROID_ALIYUN_SERVICES_JSON", "aliyun-emas-services.json"),
          )
          def android_package(client):
              if not isinstance(client, dict):
                  return None
              info = client.get("client_info")
              if not isinstance(info, dict):
                  return None
              android = info.get("android_client_info")
              return android.get("package_name") if isinstance(android, dict) else None

          pending = []
          for name, filename in configs:
              raw = os.environ.get(name, "").strip()
              if not raw:
                  print(f"{name} is not configured; this push provider stays disabled")
                  continue
              try:
                  data = json.loads(raw)
              except json.JSONDecodeError:
                  raise SystemExit(f"{name} must contain the complete JSON file")
              if not isinstance(data, dict):
                  raise SystemExit(f"{name} must contain a JSON object")
              if filename == "google-services.json":
                  clients = data.get("client", [])
                  matches = isinstance(clients, list) and any(
                      android_package(client) == package for client in clients
                  )
                  if not matches:
                      raise SystemExit(f"{name} must be an Android client configuration for {package}, not an Admin service-account key")
              else:
                  config = data.get("config", {})
                  if not isinstance(config, dict) or config.get("emas.packageName") != package:
                      raise SystemExit(f"{name} must be downloaded for package {package}")
                  if not config.get("emas.appKey") or not config.get("emas.appSecret"):
                      raise SystemExit(f"{name} is missing the EMAS appKey or appSecret")
              pending.append((filename, raw))
          # Validate both providers before writing either file.
          for filename, raw in pending:
              path = Path("clients/android/app") / filename
              with path.open("x", encoding="utf-8") as stream:
                  path.chmod(0o600)
                  stream.write(raw)
          PY

      # 构建时不提供正式签名凭据;只在最后的签名步骤读取 Repository Secrets。
      - name: Build Android release APK
        working-directory: clients/android
        run: bash ./gradlew --no-daemon assembleRelease

      - name: Remove Android push configuration
        if: always()
        run: |
          rm -f -- clients/android/app/google-services.json clients/android/app/aliyun-emas-services.json

      - name: Sign and verify Android APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/gateterm-release.keystore"
          trap 'rm -f -- "$keystore"' EXIT
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          required = ("ANDROID_KEYSTORE_BASE64", "ANDROID_STORE_PASSWORD",
                      "ANDROID_KEY_ALIAS", "ANDROID_KEY_PASSWORD")
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing Android signing secrets: " + ", ".join(missing))
          encoded = "".join(os.environ["ANDROID_KEYSTORE_BASE64"].split())
          data = base64.b64decode(encoded, validate=True)
          if not data:
              raise SystemExit("Android signing keystore is empty")
          path = Path(os.environ["RUNNER_TEMP"]) / "gateterm-release.keystore"
          with path.open("xb") as stream:
              path.chmod(0o600)
              stream.write(data)
          PY
          tools="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION"
          unsigned="clients/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          mkdir -p dist
          apk="gateterm-android-${VERSION}-arm64-v8a.apk"
          "$tools/apksigner" sign \
            --ks "$keystore" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_STORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --v4-signing-enabled false --out "dist/$apk" "$unsigned"
          "$tools/apksigner" verify --verbose --print-certs "dist/$apk"
          "$tools/zipalign" -c -P 16 4 "dist/$apk"
          (cd dist && sha256sum "$apk" > "$apk.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: gateterm-android-arm64-v8a
          path: |
            dist/*.apk
            dist/*.sha256
          if-no-files-found: error

  # 只在一个 job 里创建 Release:多个 matrix job 并发调用 action-gh-release
  # 会抢着建同一个 release,偶发出现重复的草稿或上传失败
  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [prepare, build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.prepare.outputs.version }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
