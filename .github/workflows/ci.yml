name: ci
on:
  push:
    branches: [dev, master]
  pull_request:

env:
  # Linux desktop(desktop-web / desktop-native)编译期需要的系统库,release.yml 里有同一份
  LINUX_DESKTOP_DEPS: libgtk-3-dev libxkbcommon-x11-dev libwayland-dev libfontconfig-dev libx11-xcb-dev libvulkan-dev

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install desktop dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.LINUX_DESKTOP_DEPS }}
      - name: Build web client
        working-directory: clients/web
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build
      # desktop-web / desktop-native 在三个平台上都构建:Linux 的托盘走 StatusNotifierItem
      - name: Rust tests
        shell: bash
        run: |
          cargo test --workspace
          cargo test --manifest-path clients/desktop-native/Cargo.toml -p gateterm-desktop-native
      - name: Clippy
        shell: bash
        run: |
          cargo clippy --workspace -- -D warnings
          cargo clippy --manifest-path clients/desktop-native/Cargo.toml -p gateterm-desktop-native --no-deps -- -D warnings
