name: ci
on:
  push:
    branches: [dev, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build web client
        working-directory: clients/web
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build
      - name: Rust tests
        shell: bash
        run: |
          # gateterm-desktop-web / gateterm-desktop-native 依赖系统托盘与平台自启,仅支持 Windows/macOS
          if [ "${{ runner.os }}" = "Linux" ]; then
            cargo test --workspace --exclude gateterm-desktop-web
          else
            cargo test --workspace
            cargo test --manifest-path clients/gateterm-desktop-native/Cargo.toml -p gateterm-desktop-native
          fi
      - name: Clippy
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            cargo clippy --workspace --exclude gateterm-desktop-web -- -D warnings
          else
            cargo clippy --workspace -- -D warnings
            cargo clippy --manifest-path clients/gateterm-desktop-native/Cargo.toml -p gateterm-desktop-native -- -D warnings
          fi
